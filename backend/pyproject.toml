[project]
name = "flexd-jobx-backend"
version = "0.1.0"
description = "JobX API: accounts, portfolio evidence, skills, and job matching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncmy>=0.2.10,<0.3",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2,<3",
    "boto3>=1.35,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
